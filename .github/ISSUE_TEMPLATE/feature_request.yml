name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Describe the problem it solves — that's more useful than
        jumping straight to a solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: It's hard to compare two stocks side by side because...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: Please confirm the idea fits the project's principles.
      options:
        - label: It keeps data free and keyless (no API keys, logins, or paid services)
          required: true
        - label: It keeps forecasts educational, not investment advice
          required: true
